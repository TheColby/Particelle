name: CI

on:
  push:
  pull_request:

jobs:
  workspace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y sox libasound2-dev pkg-config

      - name: Verify canonical sample pack
        run: ./scripts/verify_sample_pack.sh

      - name: Validate Homebrew formula syntax
        run: ruby -c Formula/particelle.rb

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Performance gate
        run: ./scripts/check_performance.sh

      - name: First-run onboarding gate
        run: ./scripts/check_first_run.sh

  examples:
    needs: workspace
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y sox libasound2-dev pkg-config

      - name: Example regression gate (sharded)
        env:
          EXAMPLE_SHARD_TOTAL: "4"
          EXAMPLE_SHARD_INDEX: ${{ matrix.shard_index }}
        run: ./scripts/check_examples.sh

  render-parity:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux audio build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Enforce native render parity
        run: ./scripts/check_render_parity.sh

      - name: Upload parity report
        uses: actions/upload-artifact@v4
        with:
          name: render-parity-${{ runner.os }}
          path: target/render-parity/report.json
