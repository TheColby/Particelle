[package]
name = "obelisk-m0"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
particelle-midi.workspace = true
particelle-io.workspace = true
particelle-tuning.workspace = true
hound.workspace = true
sha2.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = ["realtime"]
realtime = ["particelle-midi/realtime", "particelle-io/realtime"]

[[bin]]
name = "obelisk-m0-render"
path = "src/bin/render.rs"

[[bin]]
name = "obelisk-m0-live"
path = "src/bin/live.rs"
required-features = ["realtime"]
